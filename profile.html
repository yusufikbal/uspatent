<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profil · US Patent Database</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body class="gated">
<main>
  <h1>Profil</h1>
  <div class="muted" id="who"></div>

  <form class="card form" id="fProfile" style="margin-top:18px">
    <h3>Bilgilerim</h3>
    <label for="name">Ad Soyad</label>
    <input id="name" required maxlength="80">
    <label for="email">E-posta</label>
    <input id="email" type="email" maxlength="120">
    <button class="primary">Kaydet</button>
    <div class="msg" id="msgProfile"></div>
  </form>

  <form class="card form" id="fPass">
    <h3>Şifre değiştir</h3>
    <label for="cur">Mevcut şifre</label>
    <input id="cur" type="password" autocomplete="current-password" required>
    <label for="new1">Yeni şifre (en az 8 karakter)</label>
    <input id="new1" type="password" autocomplete="new-password" minlength="8" required>
    <label for="new2">Yeni şifre (tekrar)</label>
    <input id="new2" type="password" autocomplete="new-password" minlength="8" required>
    <button class="primary">Şifreyi değiştir</button>
    <div class="msg" id="msgPass"></div>
  </form>
</main>
<script src="/assets/app.js"></script>
<script>
const say = (id, text, ok) => { $(id).textContent = text; $(id).className = 'msg ' + (ok ? 'ok' : 'err'); };

(async () => {
  const me = await boot('profile');
  if (!me) return;
  $('who').textContent = 'Kullanıcı adı: ' + me.username;
  $('name').value = me.displayName || '';
  $('email').value = me.email || '';
})();

$('fProfile').onsubmit = async e => {
  e.preventDefault();
  try {
    const me = await api('/api/auth?action=profile', { method: 'PUT', body: { displayName: $('name').value, email: $('email').value } });
    document.querySelector('.nav a[href="/profile.html"]').textContent = me.displayName;
    say('msgProfile', 'Kaydedildi.', true);
  } catch (err) { say('msgProfile', err.message); }
};

$('fPass').onsubmit = async e => {
  e.preventDefault();
  if ($('new1').value !== $('new2').value) return say('msgPass', 'Yeni şifreler eşleşmiyor.');
  try {
    await api('/api/auth?action=password', { method: 'POST', body: { current: $('cur').value, next: $('new1').value } });
    $('fPass').reset();
    say('msgPass', 'Şifreniz değiştirildi. Diğer cihazlardaki oturumlar kapatıldı.', true);
  } catch (err) { say('msgPass', err.message); }
};
</script>
</body>
</html>
