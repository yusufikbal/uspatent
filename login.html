<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giriş · US Patent Database</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<main>
  <form class="card login form" id="f">
    <h1>US Patent Database</h1>
    <label for="u">Kullanıcı adı</label>
    <input id="u" autocomplete="username" required autofocus>
    <label for="p">Şifre</label>
    <input id="p" type="password" autocomplete="current-password" required>
    <button class="primary" style="width:100%">Giriş yap</button>
    <div class="msg err" id="msg"></div>
  </form>
</main>
<script src="/assets/app.js"></script>
<script>
$('f').onsubmit = async e => {
  e.preventDefault();
  $('msg').textContent = '';
  try {
    await api('/api/auth?action=login', { method: 'POST', body: { username: $('u').value, password: $('p').value } });
    const next = param('next');
    location.href = next && next.startsWith('/') && !next.startsWith('//') ? next : '/';
  } catch (err) { $('msg').textContent = err.message; }
};
</script>
</body>
</html>
