<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07080a">
<title>USPatents · Patent Intelligence</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body class="gated">
<main class="home">
  <section class="hero">
    <div class="hero-mark" data-logo></div>
    <div class="eyebrow" lang="en">FDA Orange Book · US Patent Intelligence</div>
    <h1 class="display">Amerikan ilaç patentleri,<br><span>tek bakışta.</span></h1>
    <p class="lead">Orange Book'taki ürünleri, US patentlerini ve exclusivity sürelerini molekül bazında analiz edin.</p>

    <div class="hero-search with-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m21 21-4.3-4.3"/><circle cx="11" cy="11" r="7"/></svg>
      <input id="q" data-search placeholder="Kütüphanede molekül ara — örn. Semaglutide" autocomplete="off" aria-label="Molekül ara">
      <kbd>/</kbd>
      <div class="results" id="res" hidden></div>
    </div>

    <div class="hero-actions">
      <button class="primary lg" id="btnNew" data-icon="plus">Yeni analiz yap</button>
      <a class="btn lg" href="/library.html">US Patent Kütüphanesi <span data-icon="arrowRight"></span></a>
    </div>

    <form class="panel newpanel" id="newPanel" hidden>
      <div class="grid2">
        <label class="field"><span>Etken madde(ler) — kombinasyonlar için "+" ile ayırın</span><input id="ing" placeholder="örn. Sitagliptin + Metformin"></label>
        <label class="field"><span>Dozaj formu (opsiyonel)</span><input id="form" placeholder="örn. EXTENDED RELEASE"></label>
      </div>
      <div class="row">
        <button class="primary" data-icon="arrowRight">Analiz et</button>
        <button type="button" class="ghost" id="btnCancel">Vazgeç</button>
        <span class="err" id="newMsg"></span>
      </div>
    </form>
  </section>

  <section class="stats" id="stats">
    <div class="panel stat"><span class="sk" style="width:40%;height:10px"></span><span class="sk" style="width:30%;height:26px;margin-top:12px"></span></div>
    <div class="panel stat"><span class="sk" style="width:40%;height:10px"></span><span class="sk" style="width:30%;height:26px;margin-top:12px"></span></div>
    <div class="panel stat"><span class="sk" style="width:40%;height:10px"></span><span class="sk" style="width:30%;height:26px;margin-top:12px"></span></div>
  </section>

  <section class="recent">
    <div class="section-head"><h2>Son eklenen analizler</h2><a href="/library.html">Tümünü gör <span data-icon="arrowRight"></span></a></div>
    <div class="panel list" id="recent">
      <div class="sk" style="height:14px;width:60%;margin:20px 14px"></div><div class="sk" style="height:14px;width:45%;margin:20px 14px"></div>
    </div>
  </section>
</main>
<script src="/assets/app.js"></script>
<script>
let mols = [], sel = -1;

(async () => {
  if (!(await boot('home'))) return;
  if (param('new')) openNew();
  mols = await api('/api/molecules');
  renderOverview();
})();

// Figures come from each molecule's last FDA fetch (summary); unopened molecules are counted separately
function renderOverview() {
  const withData = mols.filter(m => m.summary);
  const products = withData.reduce((a, m) => a + m.summary.products, 0), patents = withData.reduce((a, m) => a + m.summary.patents, 0);
  const note = withData.length < mols.length ? `${withData.length}/${mols.length} molekülün verisine göre` : 'Tüm moleküllerin verisine göre';
  $('stats').innerHTML = `
    <div class="panel stat"><small>Kütüphanedeki molekül</small><b>${mols.length}</b><span>Ekibin ortak analiz listesi</span></div>
    <div class="panel stat"><small>Ürün (Brand · NDA)</small><b>${products}</b><span>${note}</span></div>
    <div class="panel stat"><small>US patent</small><b>${patents}</b><span>${note}</span></div>`;
  const recent = [...mols].sort((a, b) => String(b.createdAt || '').localeCompare(String(a.createdAt || ''))).slice(0, 5);
  $('recent').innerHTML = recent.map(m => `<a href="/molecule.html?id=${encodeURIComponent(m.id)}">
      <div><div class="mol-name">${esc(m.label)}</div><span class="mol-ing">${esc(m.ingredients.join(' + '))}</span></div>
      <span class="who">${m.createdBy ? `<span class="avatar xs">${esc(initials(m.createdBy))}</span>${esc(m.createdBy)}` : ''}</span>
      <span class="go">${icon('chevRight')}</span></a>`).join('')
    || emptyState('molecule', 'Henüz analiz yok', 'İlk molekülünüzü ekleyerek patent kütüphanesini oluşturun.');
}

function openNew(prefill) {
  $('newPanel').hidden = false;
  if (prefill) $('ing').value = prefill;
  $('ing').focus();
}
$('btnNew').onclick = () => openNew();
$('btnCancel').onclick = () => { $('newPanel').hidden = true; $('newMsg').textContent = ''; };
$('newPanel').onsubmit = async e => {
  e.preventDefault();
  $('newMsg').textContent = '';
  try { await addMolecule($('ing').value, $('form').value.trim()); } catch (err) { $('newMsg').textContent = err.message; }
};

function matches() {
  const t = $('q').value.trim().toLowerCase();
  return t ? mols.filter(m => m.label.toLowerCase().includes(t) || m.ingredients.some(i => i.toLowerCase().includes(t))) : [];
}
function showResults() {
  const t = $('q').value.trim(), list = matches().slice(0, 8);
  if (!t) { $('res').hidden = true; return; }
  $('res').hidden = false;
  $('res').innerHTML = list.map((m, i) => `<a href="/molecule.html?id=${encodeURIComponent(m.id)}" class="${i === sel ? 'sel' : ''}">${icon('molecule')}<span>${esc(m.label)}</span></a>`).join('')
    + (list.length ? '' : `<div class="r-empty">Kütüphanede “${esc(t)}” bulunamadı.</div>`)
    + `<a href="#" id="resNew" class="r-new">${icon('plus')}<span>“${esc(t)}” için yeni analiz yap</span></a>`;
  $('resNew').onclick = e => { e.preventDefault(); $('res').hidden = true; openNew(t); };
}
$('q').oninput = () => { sel = -1; showResults(); };
$('q').onkeydown = e => {
  const list = matches().slice(0, 8);
  if (e.key === 'ArrowDown') { sel = Math.min(sel + 1, list.length - 1); showResults(); e.preventDefault(); }
  if (e.key === 'ArrowUp') { sel = Math.max(sel - 1, -1); showResults(); e.preventDefault(); }
  if (e.key === 'Escape') $('res').hidden = true;
  if (e.key === 'Enter') {
    const m = list[sel] || (list.length === 1 && list[0]);
    location.href = m ? '/molecule.html?id=' + encodeURIComponent(m.id) : '/library.html?q=' + encodeURIComponent($('q').value.trim());
  }
};
document.addEventListener('click', e => { if (!e.target.closest('.hero-search')) $('res').hidden = true; });
</script>
</body>
</html>
