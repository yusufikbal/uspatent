<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>US Patent Database</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body class="gated">
<main>
  <div class="hero">
    <h1>US Patent Database</h1>
    <div class="muted">FDA Orange Book patent kütüphanesi</div>

    <div class="search">
      <input id="q" placeholder="Molekül ara — örn. Semaglutide" autocomplete="off">
      <div class="results" id="res" hidden></div>
    </div>

    <div class="row" style="justify-content:center">
      <button class="primary" id="btnNew">Yeni analiz yap</button>
      <a class="btn" href="/library.html">US Patent Kütüphanesi →</a>
    </div>

    <form class="card panel" id="newPanel" hidden>
      <label for="ing">Etken madde(ler) — kombinasyonlar için "+" ile ayırın</label>
      <input id="ing" placeholder="örn. Sitagliptin + Metformin">
      <label for="form">Dozaj formu (opsiyonel)</label>
      <input id="form" placeholder="örn. EXTENDED RELEASE">
      <div class="row" style="margin-top:14px"><button class="primary">Analiz et</button><span class="err" id="newMsg"></span></div>
    </form>
  </div>
</main>
<script src="/assets/app.js"></script>
<script>
let mols = [], sel = -1;

(async () => {
  if (!(await boot('home'))) return;
  if (param('new')) openNew();
  mols = await api('/api/molecules');
})();

function openNew(prefill) {
  $('newPanel').hidden = false;
  if (prefill) $('ing').value = prefill;
  $('ing').focus();
}
$('btnNew').onclick = () => openNew();
$('newPanel').onsubmit = async e => {
  e.preventDefault();
  $('newMsg').textContent = '';
  try { await addMolecule($('ing').value, $('form').value.trim()); } catch (err) { $('newMsg').textContent = err.message; }
};

function matches() {
  const t = $('q').value.trim().toLowerCase();
  return t ? mols.filter(m => m.label.toLowerCase().includes(t) || m.ingredients.some(i => i.toLowerCase().includes(t))) : [];
}
function showResults() {
  const t = $('q').value.trim(), list = matches().slice(0, 8);
  if (!t) { $('res').hidden = true; return; }
  $('res').hidden = false;
  $('res').innerHTML = list.map((m, i) => `<a href="/molecule.html?id=${encodeURIComponent(m.id)}" class="${i === sel ? 'sel' : ''}">${esc(m.label)}</a>`).join('')
    + (list.length ? '' : `<div class="muted">Kütüphanede bulunamadı.</div>`)
    + `<a href="#" id="resNew">“${esc(t)}” için yeni analiz yap →</a>`;
  $('resNew').onclick = e => { e.preventDefault(); $('res').hidden = true; openNew(t); };
}
$('q').oninput = () => { sel = -1; showResults(); };
$('q').onkeydown = e => {
  const list = matches().slice(0, 8);
  if (e.key === 'ArrowDown') { sel = Math.min(sel + 1, list.length - 1); showResults(); e.preventDefault(); }
  if (e.key === 'ArrowUp') { sel = Math.max(sel - 1, -1); showResults(); e.preventDefault(); }
  if (e.key === 'Escape') $('res').hidden = true;
  if (e.key === 'Enter') {
    const m = list[sel] || (list.length === 1 && list[0]);
    location.href = m ? '/molecule.html?id=' + encodeURIComponent(m.id) : '/library.html?q=' + encodeURIComponent($('q').value.trim());
  }
};
document.addEventListener('click', e => { if (!e.target.closest('.search')) $('res').hidden = true; });
</script>
</body>
</html>
