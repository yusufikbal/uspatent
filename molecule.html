<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07080a">
<title>Molekül · USPatents</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/assets/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="gated">
<main>
  <a class="crumb" href="/library.html" data-icon="arrowLeft">US Patent Kütüphanesi</a>
  <div class="page-head">
    <div>
      <div class="eyebrow">Molekül analizi</div>
      <h1 id="title"><span class="sk" style="width:260px;height:28px"></span></h1>
      <div class="muted" id="meta">&nbsp;</div>
    </div>
    <div class="actions">
      <button id="btnRefresh" data-icon="refresh">Verileri güncelle</button>
      <button class="primary" id="btnExport" data-icon="download">Excel'e aktar</button>
      <button class="danger" id="btnDelete" data-icon="trash">Sil</button>
    </div>
  </div>

  <div class="panel toolbar">
    <div class="with-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="m21 21-4.3-4.3"/><circle cx="11" cy="11" r="7"/></svg>
      <input id="fText" data-search placeholder="Patent no veya ürün ara" aria-label="Patent no veya ürün ara">
    </div>
    <select id="fBrand" aria-label="Ürün filtresi"></select>
    <label class="switch"><input type="checkbox" id="fHideExp"> Süresi dolanları gizle</label>
    <div class="seg">
      <button id="btnOpenAll">Tümünü aç</button>
      <button id="btnCloseAll">Tümünü kapat</button>
    </div>
  </div>
  <div id="out"></div>
</main>
<script src="/assets/app.js"></script>
<script>
let mol, data, notes = {}, openKeys = null;
const timers = {};
$('out').innerHTML = skeletonCards(4);

(async () => {
  if (!(await boot('library'))) return;
  const [mols, n] = await Promise.all([api('/api/molecules'), api('/api/notes')]);
  mol = mols.find(m => m.id === param('id'));
  if (!mol) {
    $('title').textContent = 'Molekül bulunamadı';
    $('out').innerHTML = emptyState('molecule', 'Bu molekül kütüphanede yok', 'Silinmiş olabilir ya da bağlantı hatalı.', `<a class="btn" href="/library.html">${icon('arrowLeft')} Kütüphaneye dön</a>`);
    return;
  }
  notes = n;
  document.title = mol.label + ' · USPatents';
  $('title').textContent = mol.label;
  await load(false);
})();

async function load(force) {
  $('out').innerHTML = skeletonCards(4);
  $('btnRefresh').disabled = true;
  try { data = await loadFda(mol, force); }
  catch (e) {
    $('btnRefresh').disabled = false;
    $('out').innerHTML = emptyState('alert', 'FDA Orange Book\'a ulaşılamadı', esc(e.message), `<button onclick="load(true)">${icon('refresh')} Tekrar dene</button>`, true);
    return;
  }
  $('btnRefresh').disabled = false;
  $('meta').textContent = `Son Güncelleme Tarihi: ${fmtTs(data.at)}`;
  $('fBrand').innerHTML = '<option value="">Tüm ürünler</option>' + data.groups.map(g => `<option>${esc(g.key)}</option>`).join('');
  if (!openKeys) openKeys = new Set();  // every product card starts closed
  render();
  syncSummary(mol, data).catch(() => {});
}

function view() {
  const t = $('fText').value.trim().toUpperCase().replace(/^US\s*/, ''), b = $('fBrand').value, hide = $('fHideExp').checked;
  return data.groups.filter(g => !b || g.key === b).map(g => {
    const hit = t && g.key.toUpperCase().includes(t);
    return {
      ...g,
      patents: g.patents.filter(p => (!hide || (p.ped || p.exp) >= today) && (!t || hit || p.pn.includes(t))),
      excl: g.excl.filter(x => !hide || x.exp >= today),
    };
  }).filter(g => !t || g.patents.length);
}

// Colour index for a product number, stable within its product card
const pc = (g, no) => Math.max(0, g.doses.findIndex(d => d.no === no)) % 6;

function noteMeta(n) { return n ? `${esc(n.by)} · ${fmtTs(n.at)}` : ''; }

function render() {
  if (!data.groups.length) {
    $('out').innerHTML = `<div class="panel">${emptyState('alert', "FDA'de onaylı ürün yoktur",
      `“${esc(mol.label)}” için FDA Orange Book'ta kayıt bulunamadı; listelenmiş US patenti ve exclusivity de yok.`, '', true)}</div>`;
    return;
  }
  let html = '';
  const searching = !!$('fText').value.trim();
  for (const g of view()) {
    const open = searching || openKeys.has(g.key);
    html += `<details class="prod" data-key="${esc(g.key)}"${open ? ' open' : ''}>
      <summary>
        <div class="phead">
          <span class="chev">${icon('chevRight')}</span>
          <div class="ptitle">
            <h3>${esc(g.brand)} <span class="nda">${esc(g.nda)}</span></h3>
            <div class="pstats">
              <span class="pill"><b>${g.doses.length}</b> doz</span>
              <span class="pill"><b>${g.patents.length}</b> patent</span>
              <span class="pill"><b>${g.excl.length}</b> exclusivity</span>
            </div>
          </div>
          <span class="approval"><small>İlk onay</small><b>${fmtApproval(g.approval)}</b></span>
        </div>
      </summary>
      <div class="pbody">
        <div class="dchips">${g.doses.map(d => `<span class="dchip pc${pc(g, d.no)}"><i>${esc(d.no)}</i>${esc(d.str)}</span>`).join('')}</div>
        <div class="sect" lang="en">US Patents <span class="count">${g.patents.length}</span></div>`;
    if (!g.patents.length) html += '<p class="subtle">Orange Book\'ta listelenmiş patent yok.</p>';
    else {
      html += '<table><thead lang="en"><tr><th>US Patent No.</th><th>Expiration Date</th><th>Patent Yorumu</th></tr></thead><tbody>';
      for (const p of g.patents) {
        const n = notes[p.pn];
        html += `<tr><td class="pn"><span class="us">US</span>${esc(p.pn)}</td>
          <td class="exp"><span class="status ${expStatus(p.ped || p.exp)}">${fmtDate(p.exp)}</span>${p.ped ? `<span class="sub">PED ${fmtDate(p.ped)}</span>` : ''}</td>
          <td class="note"><textarea data-pn="${esc(p.pn)}" rows="1" placeholder="Yorum ekle…" aria-label="US ${esc(p.pn)} yorumu">${esc(n?.text || '')}</textarea><span class="note-meta" data-meta="${esc(p.pn)}">${noteMeta(n)}</span></td></tr>`;
      }
      html += '</tbody></table>';
    }
    html += `<div class="sect" lang="en">Exclusivity Data <span class="count">${g.excl.length}</span></div>`;
    if (!g.excl.length) html += '<p class="subtle">Orange Book\'ta listelenmiş exclusivity yok.</p>';
    else {
      html += '<table><thead lang="en"><tr><th>Product No</th><th>Exclusivity Code</th><th>Tanım</th><th>Exclusivity Expiration</th></tr></thead><tbody>';
      for (const [i, x] of g.excl.entries()) {
        const first = i === 0 || g.excl[i - 1].no !== x.no;
        html += `<tr class="pc${pc(g, x.no)} prow${first && i ? ' pfirst' : ''}">
          <td><span class="dchip solo pc${pc(g, x.no)}"><i>${esc(x.no)}</i></span><span class="sub">${esc(x.str)}</span></td>
          <td class="code">${esc(x.code)}</td>
          <td class="muted">${esc(exclDef(x.code))}</td>
          <td class="exp"><span class="status ${expStatus(x.exp)}">${fmtDate(x.exp)}</span></td></tr>`;
      }
      html += '</tbody></table>';
    }
    html += '</div></details>';
  }
  $('out').innerHTML = html || `<div class="panel">${emptyState('filter', 'Filtrelere uyan sonuç yok', 'Arama metnini veya filtreleri değiştirmeyi deneyin.')}</div>`;
}

// Remember which products are open so filtering doesn't collapse them ('toggle' doesn't bubble, hence capture)
$('out').addEventListener('toggle', e => {
  const k = e.target.dataset?.key;
  if (k && !$('fText').value.trim()) e.target.open ? openKeys.add(k) : openKeys.delete(k);
}, true);
$('btnOpenAll').onclick = () => { if (!data) return; openKeys = new Set(data.groups.map(g => g.key)); render(); };
$('btnCloseAll').onclick = () => { if (!data) return; openKeys = new Set(); $('fText').value = ''; render(); };

// Comments save to the server shortly after typing stops; the same patent under other products updates too
$('out').addEventListener('input', e => {
  const pn = e.target.dataset.pn;
  if (!pn) return;
  const text = e.target.value;
  document.querySelectorAll(`textarea[data-pn="${pn}"]`).forEach(t => { if (t !== e.target) t.value = text; });
  document.querySelectorAll(`[data-meta="${pn}"]`).forEach(s => { s.textContent = 'kaydediliyor…'; s.classList.remove('err'); });
  clearTimeout(timers[pn]);
  timers[pn] = setTimeout(async () => {
    try {
      const r = await api('/api/notes', { method: 'PUT', body: { pn, text } });
      if (r.note) notes[pn] = r.note; else delete notes[pn];
      document.querySelectorAll(`[data-meta="${pn}"]`).forEach(s => s.textContent = noteMeta(notes[pn]));
    } catch (err) {
      document.querySelectorAll(`[data-meta="${pn}"]`).forEach(s => { s.textContent = 'kaydedilemedi: ' + err.message; s.classList.add('err'); });
    }
  }, 700);
});

$('fText').oninput = $('fBrand').onchange = $('fHideExp').onchange = () => data && render();
$('btnRefresh').onclick = () => load(true);
$('btnExport').onclick = () => data && downloadExcel(patentRows(mol, view(), notes), mol.label.replace(/[^\w]+/g, '_'), exclRows(mol, view()));
$('btnDelete').onclick = async () => {
  if (!confirm(`“${mol.label}” kütüphaneden kaldırılsın mı? Patent yorumları silinmez.`)) return;
  await api('/api/molecules?id=' + encodeURIComponent(mol.id), { method: 'DELETE' });
  location.href = '/library.html';
};
</script>
</body>
</html>
